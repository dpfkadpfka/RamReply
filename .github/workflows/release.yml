name: release
# package.json의 version을 올려 main에 올리면 새 버전이 빌드·배포됨
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 릴리스 공개
        shell: bash
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
